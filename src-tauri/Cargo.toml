[package]
name = "tizumark"
version = "1.2.5"
description = "A lightweight cross-platform Markdown editor"
authors = ["TizuMark"]
edition = "2021"
license = "GPL-3.0"

[lib]
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-single-instance = "2"
# 「关闭到托盘」OS 级全局热键：窗口隐藏到托盘后前端 keydown 收不到按键，只能靠
# 系统级热键唤回窗口（见 lib.rs set_close_to_tray_shortcut / toggle_main_window）
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
notify = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# 更新安装包 minisign 签名校验（与 tauri-plugin-updater 同一 crate/同一口径）
minisign-verify = "0.2"
base64 = "0.22"
md-5 = "0.10"
imagesize = "0.13"
encoding_rs = "0.8"
regex = "1"
# 系统字体枚举（fontdb 纯 Rust，跨平台：Windows 目录+macOS+Linux fontconfig）
fontdb = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
# 补充扫描注册表指向的字体文件（企业批量安装到任意路径的字体），仅 Windows
winreg = "0.52"
# PDF 导出走 WebView2 的 PrintToPdf（无打印对话框、无下载气泡，见 lib.rs print_to_pdf）。
# 版本必须与 tauri/wry 内部一致（Cargo.lock: webview2-com 0.38.2 / windows 0.61.3），
# 否则 ICoreWebView2* 接口类型不匹配，编译期就报 trait 不满足。
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }

[patch.crates-io]
brotli = { git = "https://github.com/dropbox/rust-brotli", rev = "9cbed81a1a098fcd4ffcf956429dce6154415970" }
