<h1>Grid table alignment markers</h1>
<p>Alignment is declared on the header separator: column 1 left, column 2
center, column 3 right.</p>
<table>
<thead>
<tr><th style="text-align: left">Left</th><th style="text-align: center">Mid</th><th style="text-align: right">Right</th></tr>
</thead>
<tbody>
<tr><td style="text-align: left">a</td><td style="text-align: center">b</td><td style="text-align: right">c</td></tr>
</tbody>
</table>
