<h1>Grid table with a rowspan</h1>
<p>The body cell &quot;R&quot; spans two rows: the border between the two body rows is
dotted over column 1's range, and the continuation band leaves that cell area
blank.</p>
<table>
<thead>
<tr><th>H1</th><th>H2</th></tr>
</thead>
<tbody>
<tr><td rowspan="2">R</td><td>B</td></tr>
<tr><td>C</td></tr>
</tbody>
</table>
