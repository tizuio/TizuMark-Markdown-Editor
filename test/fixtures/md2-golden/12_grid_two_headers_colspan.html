<h1>Two header rows with a colspan category cell</h1>
<p>Header row 1: &quot;Region&quot; plus the category cell &quot;Sales&quot; spanning the two
sub-columns &quot;North&quot;/&quot;South&quot; of header row 2. The merge lies entirely inside
the header block, which is legal.</p>
<table>
<thead>
<tr><th>Region</th><th colspan="2">Sales</th></tr>
<tr><th></th><th>North</th><th>South</th></tr>
</thead>
<tbody>
<tr><td>East</td><td>10</td><td>20</td></tr>
</tbody>
</table>
