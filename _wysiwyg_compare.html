<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- 内联 favicon：file:// 页面默认的 /favicon.ico 请求会 404 进 console，被驱动计为页面错误 -->
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/lib/codemirror/codemirror.css">
<link rel="stylesheet" href="src/styles.css">
<style>
  body { margin: 0; }
  /* 与真实 app 同构的容器层级：wysiwyg 规则（去行号、32px 行留白、遮罩样式）都挂在
     .editor-container.wysiwyg-mode 作用域下，harness 必须复刻这层结构才测得到真实样式 */
  .harness-container { width: 700px; height: 600px; flex: none; }
</style>
</head>
<body>
<div class="editor-container wysiwyg-mode harness-container" id="wysiwyg-container">
  <div class="editor-pane">
    <div id="editor"></div>
  </div>
  <div class="preview-pane"></div>
</div>
<div class="editor-container preview-mode harness-container" id="reading-container">
  <div class="editor-pane"></div>
  <div class="preview-pane">
    <div class="preview-content" id="reading"></div>
  </div>
</div>
<script src="src/lib/codemirror/codemirror.js"></script>
<script src="src/lib/unified-bundle.js"></script>
<script src="src/lib/highlight.js/highlight.min.js"></script>
<link rel="stylesheet" href="src/lib/katex/katex.min.css">
<script src="src/lib/katex/katex.min.js"></script>
<script src="src/lib/katex/auto-render.min.js"></script>
<script src="src/lib/mermaid/mermaid.min.js"></script>
<script src="src/modules/preview-post.js"></script>
<script src="src/modules/code-block.js"></script>
<script src="src/modules/image-processor.js"></script>
<script src="src/modules/render-post.js"></script>
<script src="src/modules/wysiwyg.js"></script>
<script src="src/modules/empty-hint.js"></script>
<script>
// 对比 harness：真实 CM5 + 真实 UnifiedRenderer + 真实 wysiwyg/empty-hint 遮罩代码。
// 由 scripts/wysiwyg-browser-check.mjs 驱动，结果写回 window.__RESULT / __RESULT2。
(function () {
  'use strict';

  const DOC = [
    '# Superpowers-ZH 中文增强版',
    '',
    '本项目已安装 superpowers-zh 技能框架（20 个 skills）。',
    '',
    '## 核心规则',
    '',
    '1.',
    '    收到任务，先检查是否有匹配的 skill — 哪怕只有 1% 的可能性也要检查',
    '',
    '2.',
    '    设计先于编码 — 收到功能需求时，先用 brainstorming skill 做需求分析',
    '',
    '- 普通列表项 A',
    '- 普通列表项 B',
    '',
    '- [ ] 待办任务一',
    '- [x] 已完成任务二',
    '',
    '> 引用块第一行',
    '> 引用块第二行',
    '',
    '$$ E = mc^2 $$',
    '',
    '| 列甲 | 列乙 |',
    '| --- | --- |',
    '| 1 | 2 |',
    '',
    '```js',
    'const a = 1; // 围栏内 # 与 | 都不应切块',
    '```',
    '',
    '结尾段落。',
    '',
    // 缩写定义与使用放同一块（逐块渲染的已知边界：跨块拿不到别块的定义），
    // 这样逐块与整篇渲染行为一致，可检验遮罩内缩写还原。
    // 注意本渲染器的缩写语法是 *[term]: def（定义行单独解析，非 GFM 的 *[term]*: ）。
    // 多行展示公式且内部含独占一行的 `=`（CommonMark setext 下划线触发器）：
    // 切块若未先做公式守卫，remark 会把 `=` 当 setext 标题，公式劈成两块、前半渲染成巨型 h1
    // （真机 demo.md 矩阵乘法实测，2026-10-08 用户截图）。守卫后必须是一个完整块。
    '矩阵乘法：',
    '',
    '$$',
    '\\begin{bmatrix}',
    'a_{11} & a_{12} \\\\',
    'a_{21} & a_{22}',
    '\\end{bmatrix}',
    '=',
    '\\begin{bmatrix}',
    'c_{11} & c_{12} \\\\',
    'c_{21} & c_{22}',
    '\\end{bmatrix}',
    '$$',
    '',
    '*[Tizu]: TizuMark Editor',
    '本段使用缩写 Tizu 指代编辑器。',
    '',
    '这个特性 :rocket: 让两种模式保持一致。',
    '',
    '<details>',
    '<summary>折叠内容</summary>',
    '折叠块内部文字。',
    '</details>',
  ].join('\n');

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  // 与 Rust heading_to_id（src-tauri/src/lib.rs）对齐：字母数字保留（小写），空格/-/_ 折叠为 -
  const headingToId = (text) => {
    let id = '';
    for (const ch of String(text || '')) {
      if (/[\p{L}\p{N}]/u.test(ch)) id += ch.toLowerCase();
      else if (ch === ' ' || ch === '-' || ch === '_') id += '-';
    }
    return id.replace(/-+/g, '-').replace(/^-|-$/g, '');
  };

  // ---------- TauriApi mock（对齐真实 app 的 IPC 面） ----------
  // 真实 app 的 window.TauriApi 由 tauri-api.js COMMANDS 生成；所见即所得/阅读模式的
  // 异步后处理路径（[TOC]=generate_toc、图片=fetch_image_as_base64）都走它。harness 此前
  // 没有它 → 这些路径以「Tauri 运行时不可用」被静默跳过、从未被测到（2026-10-11 四缺陷漏网根因之一）。
  const TINY_PNG_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
  // 逐行对照 Rust generate_toc：#..######（代码围栏外）→ 嵌套 ul；无标题返回空串
  function mockGenerateToc(content) {
    const items = [];
    let inCode = false;
    for (const line of String(content || '').split('\n')) {
      const t = line.trimStart();
      if (t.startsWith('```')) { inCode = !inCode; continue; }
      if (inCode) continue;
      const m = t.match(/^(#{1,6})\s+(.*)$/);
      if (!m) continue;
      const text = m[2].trim();
      items.push({ level: m[1].length, text, id: headingToId(text) });
    }
    if (!items.length) return '';
    let html = '<div class="toc"><div class="toc-title">📑 目录</div><ul class="toc-list">';
    let prev = 0;
    for (const it of items) {
      if (it.level > prev) { for (let k = prev; k < it.level; k++) html += '<ul>'; }
      else if (it.level < prev) { for (let k = it.level; k < prev; k++) html += '</ul>'; }
      html += '<li><a href="#' + esc(it.id) + '">' + esc(it.text) + '</a></li>';
      prev = it.level;
    }
    for (let k = 0; k < prev; k++) html += '</ul>';
    html += '</ul></div>';
    return html;
  }
  window.__mockGenerateToc = mockGenerateToc;
  window.TauriApi = {
    generateToc: (args) => Promise.resolve(mockGenerateToc(args && args.content)),
    fetchImageAsBase64: async () => {
      await sleep(25); // 模拟 IPC + 读盘延迟，暴露代数/时序竞态
      return TINY_PNG_B64;
    },
    readBundledImageAsBase64: async () => { throw new Error('mock: not a bundled tab'); },
  };

  function makeEditor(doc, overrides) {
    const host = document.getElementById('editor');
    host.innerHTML = '';
    // lineNumbers: true 与真实 app 一致（app 建 CM 时恒开行号），
    // 进入所见即所得后由 applyWysiwygEditorChrome 关掉——可验证「去行号」行为
    const cm = CodeMirror(host, { value: doc, lineWrapping: true, lineNumbers: true });
    cm.setSize('700px', '600px');
    // 阅读模式参照物：#preview 的字体/字号/行高是 applySettings 写内联样式的，
    // 这里复刻真实默认值（16px / 1.7），wysiwyg 遮罩必须与之完全一致
    const reading = document.getElementById('reading');
    reading.style.fontSize = '16px';
    reading.style.lineHeight = '1.7';
    const base = {
      cm,
      settings: { softBreaks: false, tabSize: 4, extendedSyntax: true, codeLineNumbers: false, lineNumbers: true, maxWidth: 0 },
      t: (k) => k,
      preview: reading,
      isDark: false,
      escapeHtml: esc,
      escapeAttr: esc,
      headingToId,
      _mermaidCache: new Map(),
      _imageBase64Cache: new Map(),
      getCachedImageURL: (u) => u,
      activeTab: null,
    };
    if (overrides) Object.assign(base, overrides);
    const ed = Object.assign(base, window.TMWysiwyg.mixin, window.TMEmptyHint.mixin);
    ed.viewMode = 'wysiwyg';
    // 模拟 editor-core 的事件接线（真实 app 中 cursorActivity/change 都接到这里）
    cm.on('cursorActivity', () => ed.syncWysiwygActiveBlock());
    cm.on('change', () => { if (ed.viewMode === 'wysiwyg') ed.refreshWysiwygBlocks(); ed.updateEmptyLineHint(); });
    return { cm, ed, host };
  }

  const tagsOf = (h) => (h.match(/<(h\d|p|ol|ul|li|blockquote|table|thead|tbody|tr|pre|code|input)[^>]*>/g) || [])
    .map(t => t.replace(/\s[\s\S]*$/, '>')).join(',');

  // ---------- 场景 1：渲染一致性 + 提示 + 点击 + 复选框 ----------
  window.__runCompare = function () {
    const { cm, ed, host } = makeEditor(DOC);

    const readingHtml = window.UnifiedRenderer.renderMarkdown(DOC, ed.settings);
    document.getElementById('reading').innerHTML = readingHtml;
    ed.renderWysiwygMasks();

    const maskNodes = Array.from(host.querySelectorAll('.wysiwyg-block-mask'));

    // 遮罩内容统一从 mark 模型取（markText 的 replacedWith 节点），不依赖 CM 视口物化：
    // 文档底部块在 600px 视口内未渲染进 DOM，querySelectorAll 会漏掉它们（滚动才物化）。
    const markHtmlByIdx = new Map();
    // 汇总所有遮罩节点到独立容器：CM5 只把视口附近的行物化进 DOM，文档底部块不在
    // host 的 DOM 里（querySelectorAll 会漏），但 mark.replacedWith 节点始终持有完整
    // （已后处理的）innerHTML。内容检查统一走这里，与滚动位置解耦。
    const maskFrag = document.createElement('div');
    try {
      ed._wysiwygMarks.forEach((mark, idx) => {
        if (!mark || !mark.replacedWith) return;
        markHtmlByIdx.set(idx, mark.replacedWith.innerHTML);
        maskFrag.appendChild(mark.replacedWith.cloneNode(true));
      });
    } catch (e) { }
    let maskCountModel = markHtmlByIdx.size;

    // 1) white-space
    const ws = maskNodes.length ? getComputedStyle(maskNodes[0]).whiteSpace : 'none';

    // 2) 逐块与整篇同构（活动块现渲染插回对齐）
    const activeIdx = ed._wysiwygActiveIdx;
    const alignedTags = [];
    ed._wysiwygBlocks.forEach((b, i) => {
      const html = (i === activeIdx) ? ed.renderWysiwygBlockHtml(b.start, b.end) : (markHtmlByIdx.get(i) || '');
      alignedTags.push(tagsOf(html || ''));
    });
    const wholeTags = tagsOf(readingHtml);
    // math 块产出 0 个结构标签（span 不在结构集内）：逐块 join 会留空段、整篇不会，
    // 比较前两侧都去掉空段，判据才对「块级结构同构」保持对称
    const norm = (s) => s.split(',').filter(t => t !== '').join(',');
    const structureEqual = norm(wholeTags) === norm(alignedTags.join(','));

    // 3) 列表序号与内容同行
    let listInlineGap = null;
    const ol = host.querySelector('.wysiwyg-block-mask ol');
    if (ol) {
      const li = ol.querySelector('li');
      const p = li && li.querySelector('p');
      if (li && p) listInlineGap = Math.abs(p.getBoundingClientRect().top - li.getBoundingClientRect().top);
    }

    // 4) 无空列表项
    const emptyLi = maskNodes.filter(n => Array.from(n.querySelectorAll('li'))
      .some(li => li.textContent.trim() === '')).length;

    // 5) 空行塌缩
    const blankCollapsed = host.querySelectorAll('.cm-wysiwyg-blank').length;

    // 6) 空行提示：光标落空行 → wrap 类挂上 + ::after 内容 = 提示文案
    let hintClass = false, hintText = null;
    try {
      cm.setCursor({ line: 1, ch: 0 }); // 空行
      ed.updateEmptyLineHint();
      const wrappers = host.querySelectorAll('.cm-empty-placeholder');
      hintClass = wrappers.length > 0;
      if (hintClass) {
        const lineEl = wrappers[0].querySelector('.CodeMirror-line');
        hintText = getComputedStyle(lineEl, '::after').content;
      }
    } catch (e) { hintClass = false; }

    // 7) 点击锚定：点击遮罩中部，被点中的源码行顶边应回到点击时的屏幕 y（±8px）。
    //    判据用「行顶边」而非光标像素：光标落行尾，长行换行时光标自然不在行首，那是行内偏移不是视口跳动。
    let clickAnchorGap = null, clickDiag = null;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      // 先滚到文档中段：锚定本质是「把目标行拉回点击处」，若已抵文档顶/底则被浏览器钳制，
      // 那种偏差是物理上不可消除的，放在顶部测只会得到假失败。
      cm.scrollTo(0, 260);
      ed.updateWysiwygViewportMasks();
      const vis = Array.from(host.querySelectorAll('.wysiwyg-block-mask'))
        .filter(n => { const r = n.getBoundingClientRect(); return r.top > 120 && r.bottom < 520 && r.height > 20; });
      const target = vis[0] || Array.from(host.querySelectorAll('.wysiwyg-block-mask'))[3];
      const rect = target.getBoundingClientRect();
      const clickY = rect.top + rect.height / 2;
      target.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: clickY }));
      const ln = cm.getCursor().line;
      const top = cm.charCoords({ line: ln, ch: 0 }, 'window').top;
      clickAnchorGap = Math.round(Math.abs(top - clickY) * 100) / 100;
      clickDiag = { line: ln, clickY: Math.round(clickY), top: Math.round(top), scrollTop: Math.round(cm.getScrollInfo().top) };
    } catch (e) { clickAnchorGap = null; }

    // 8) 表格单元格点击定位：最后一个数据格（| 1 | 2 | 位于源码行 25，公式块占 21-22 后表头 23、分隔 24）
    let tableCellLine = null;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const tds = Array.from(host.querySelectorAll('.wysiwyg-block-mask td'));
      const td = tds[tds.length - 1];
      td.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, cancelable: true, clientY: td.getBoundingClientRect().top + 2 }));
      tableCellLine = cm.getCursor().line;
    } catch (e) { tableCellLine = null; }

    // 9) 复选框
    let checkboxToggled = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const box = host.querySelector('.wysiwyg-block-mask input[type="checkbox"]');
      ed.toggleWysiwygTaskCheckbox(box);
      checkboxToggled = /\[x\]/.test(cm.getLine(15));
      ed.toggleWysiwygTaskCheckbox(host.querySelector('.wysiwyg-block-mask input[type="checkbox"]'));
    } catch (e) { checkboxToggled = false; }

    // 10) 预览后处理对齐：公式须转 KaTeX、代码须高亮包裹、复选框须移除 disabled
    //（renderMarkdown 只产出结构 HTML，KaTeX/高亮是预览端独立 pass，遮罩不补跑就露源码）
    let mathRendered = false, codeHighlighted = false, checkboxEnabled = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      // 重建汇总（renderWysiwygMasks 会重建 marks）
      maskFrag.innerHTML = '';
      ed._wysiwygMarks.forEach((mark) => {
        if (mark && mark.replacedWith) maskFrag.appendChild(mark.replacedWith.cloneNode(true));
      });
      mathRendered = !!maskFrag.querySelector('.math-display .katex, .katex');
      codeHighlighted = !!maskFrag.querySelector('code .code-scroll');
      const cb = maskFrag.querySelector('input[type="checkbox"]');
      checkboxEnabled = !!cb && !cb.disabled;
    } catch (e) { }

    // 11) 显示效果与阅读模式逐项对齐（2026-10-08 需求）：
    //     行号隐藏 / 字号、行高、字体族一致 / 无块级底色 / 32px 水平边距 /
    //     emoji、缩写、标题锚点 id、details 展开、代码块复制按钮
    let gutterHidden = null, fontSizeParity = null, lineHeightParity = null, fontFamilyParity = null;
    let bgTransparent = null, paddingParity = null, emojiRendered = false, abbrRendered = false;
    let headingIdSet = false, detailsOpened = false, copyBtnPresent = false;
    try {
      cm.setCursor({ line: 0, ch: 0 });
      ed.renderWysiwygMasks();
      const reading = document.getElementById('reading');
      const m = host.querySelector('.wysiwyg-block-mask');
      if (m) {
        const csM = getComputedStyle(m);
        const csR = getComputedStyle(reading);
        gutterHidden = !host.querySelector('.CodeMirror-linenumber');
        fontSizeParity = csM.fontSize === csR.fontSize;
        lineHeightParity = csM.lineHeight === csR.lineHeight;
        fontFamilyParity = csM.fontFamily === csR.fontFamily;
        bgTransparent = csM.backgroundColor === 'rgba(0, 0, 0, 0)';
        // 水平边距：遮罩首个块级元素相对编辑器容器左缘 vs 阅读区首个块级元素相对其容器左缘
        const firstInMask = m.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,table,pre,blockquote,hr');
        const firstInReading = reading.querySelector('h1,h2,h3,h4,h5,h6,p,ul,ol,table,pre,blockquote,hr');
        const wrapRect = host.getBoundingClientRect();
        const readRect = reading.getBoundingClientRect();
        if (firstInMask && firstInReading) {
          const lm = Math.round(firstInMask.getBoundingClientRect().left - wrapRect.left);
          const lr = Math.round(firstInReading.getBoundingClientRect().left - readRect.left);
          paddingParity = { mask: lm, reading: lr, equal: Math.abs(lm - lr) <= 1 };
        }
        // 内容检查走 mark 模型汇总（含视口外未物化块；renderWysiwygMasks 刚重建过 marks）
        maskFrag.innerHTML = '';
        markHtmlByIdx.clear();
        ed._wysiwygMarks.forEach((mark, idx) => {
          if (!mark || !mark.replacedWith) return;
          markHtmlByIdx.set(idx, mark.replacedWith.innerHTML);
          maskFrag.appendChild(mark.replacedWith.cloneNode(true));
        });
        maskCountModel = markHtmlByIdx.size;
        emojiRendered = /🚀/.test(maskFrag.textContent);
        abbrRendered = !!maskFrag.querySelector('abbr[title="TizuMark Editor"]');
        const hs = Array.from(maskFrag.querySelectorAll('h1, h2'));
        headingIdSet = hs.length > 0 && hs.every(h => !!h.id);
        detailsOpened = !!maskFrag.querySelector('details[open]');
        copyBtnPresent = !!maskFrag.querySelector('pre .copy-btn');
      }
    } catch (e) { window.__ERR11 = (e && e.message) || String(e); }

    // 12) 多行展示公式（内含独占一行的 `=`，setext 触发器）必须是【一个完整块】：
    //     切块未做公式守卫时 remark 会把 `=` 当 setext 下划线，公式劈成两块、前半渲染成巨型 h1
    let mathBlockIntact = false;
    try {
      const blks = ed._wysiwygBlocks || [];
      mathBlockIntact = blks.some(b => {
        if (b.end - b.start < 5) return false;
        return cm.getLine(b.start).trim() === '$$' && cm.getLine(b.end - 1).trim() === '$$';
      });
    } catch (e) { mathBlockIntact = false; }

    window.__RESULT = {
      maskCount: maskCountModel,
      blockCount: ed._wysiwygBlocks.length,
      activeIdx,
      ws, structureEqual, listInlineGap, emptyLi, blankCollapsed,
      hintClass, hintText,
      clickAnchorGap, clickDiag, tableCellLine, checkboxToggled,
      mathRendered, codeHighlighted, checkboxEnabled,
      gutterHidden, fontSizeParity, lineHeightParity, fontFamilyParity,
      bgTransparent, paddingParity, emojiRendered, abbrRendered,
      headingIdSet, detailsOpened, copyBtnPresent, mathBlockIntact,
      wholeTagsSample: wholeTags.slice(0, 300),
      maskTagsSample: alignedTags.join(',').slice(0, 300),
    };
  };

  // ---------- 场景 5：整篇视觉比对（截图素材） ----------
  // 用真实文档（如 demo.md 内容）同时渲染「所见即所得（顶部）」与「阅读模式」，
  // 供驱动脚本截图后人工/视觉模型比对。
  window.__runVisual = async function (docText) {
    const doc = docText != null ? docText : DOC;
    // 模拟真实 app「打开本地文档」：activeTab 带 filePath → 相对图片走 TauriApi 读盘
    //（harness mock），不落到浏览器 fetch 兜底（file:// 下 CORS 报错，真实 app 无此路径）
    const { cm, ed, host } = makeEditor(doc, { activeTab: { filePath: 'C:/docs/demo.md', isBundled: false } });
    window.__wysiwygLast = { cm, ed, host }; // 供诊断脚本访问实例
    ed.renderWysiwygMasks();
    const reading = document.getElementById('reading');
    try {
      reading.innerHTML = window.UnifiedRenderer.renderMarkdown(doc, ed.settings);
      // 阅读模式后处理：RenderPost 共享管线（与 preview-controller.render 同 stage 同顺序，
      // 与所见即所得遮罩同一入口——截图对比的是「同一管线在两种编排下的结果」）
      const rp = window.RenderPost;
      if (rp) {

    if (window.CodeBlock) CodeBlock.processCodeBlocks(reading, { hljs: window.hljs, cache: new Map(), lineNumbers: false });
    collectCodeScroll(reading).forEach((x) => { /* 测量前先触发样式落定 */ });
    reading.querySelectorAll('.code-scroll').forEach((el) => {
      el.style.overflowY = el.scrollHeight > el.clientHeight + 1 ? 'auto' : 'hidden';
    });
    const r = collectCodeScroll(reading);

    ed.renderWysiwygMasks();
    await sleep(400); // flush + 布局落定
    const w = [];
    ed._wysiwygMarks.forEach((mark) => {
      if (!mark || !mark.replacedWith) return;
      collectCodeScroll(mark.replacedWith).forEach((x) => w.push(x));
    });

    // codeScroll=false：code-no-scroll 类接管（高度自适应、永不滚动）
    ed.settings.codeScroll = false;
    reading.classList.add('code-no-scroll');
    ed.renderWysiwygMasks();
    await sleep(400);
    const noScroll = [];
    ed._wysiwygMarks.forEach((mark) => {
      if (!mark || !mark.replacedWith) return;
      mark.replacedWith.querySelectorAll('.code-scroll').forEach((el) => {
        noScroll.push({
          cls: mark.replacedWith.classList.contains('code-no-scroll'),
          ov: el.style.overflowY || '',
          expanded: el.scrollHeight <= el.clientHeight + 1,
        });
      });
    });

    window.__RESULT_SCROLL = { wysiwyg: w, reading: r, noScroll };
    return window.__RESULT_SCROLL;
  };

  // ---------- S12：Mermaid 图表（回归：批量渲染时机 + 并发/重挂） ----------
  function maskMermaidStats(ed) {
    let containers = 0, svgs = 0, codeLeft = 0;
    try {
      ed._wysiwygMarks.forEach((mark) => {
        if (!mark || !mark.replacedWith) return;
        mark.replacedWith.querySelectorAll('.mermaid-container').forEach((c) => {
          containers++;
          if (c.querySelector('svg')) svgs++;
        });
        codeLeft += mark.replacedWith.querySelectorAll('code.language-mermaid').length;
      });
    } catch (_) {}
    return { containers, svgs, codeLeft };
  }
  window.__runMermaid = async function () {
    const doc = [
      '# 图表测试',
      '',
      '```mermaid',
      'graph TD',
      'A[开始] --> B[结束]',
      '```',
      '',
      '## 中段标题',
      '',
      '```mermaid',
      'sequenceDiagram',
      'Alice->>Bob: 你好',
      'Bob-->>Alice: 再见',
      '```',
      '',
      '## 第三段',
      '',
      '```mermaid',
      'graph LR',
      'X --> Y',
      '```',
      '',
      '结尾。',
    ].join('\n');
    const { cm, ed } = makeEditor(doc);
    const reading = document.getElementById('reading');
    reading.innerHTML = window.UnifiedRenderer.renderMarkdown(doc, ed.settings);

    ed.renderWysiwygMasks();
    await sleep(3000); // mermaid 渲染为秒级；3 块一次进入
    const m1 = maskMermaidStats(ed);

    // 阅读侧参照物：同一 processMermaid（独立缓存）
    let readingSvgs = 0, readingContainers = 0;
    try {
      if (window.PreviewPost && typeof window.mermaid !== 'undefined') {
        await window.PreviewPost.processMermaid(reading, { isDark: false, mermaidCache: new Map() });
        await sleep(300);
      }
      readingSvgs = reading.querySelectorAll('.mermaid-container svg').length;
      readingContainers = reading.querySelectorAll('.mermaid-container').length;
    } catch (_) {}

    // 光标移入第一张图所在块（转源码态）→ 再移出（重挂）→ 图必须恢复
    cm.setCursor({ line: 2, ch: 0 });   // 第一张 mermaid 围栏首行
    await sleep(300);
    cm.setCursor({ line: 21, ch: 0 });  // 结尾段落
    await sleep(2500);
    const m2 = maskMermaidStats(ed);

    window.__RESULT_MMD = { entry: m1, reading: { svgs: readingSvgs, containers: readingContainers }, afterMove: m2 };
    return window.__RESULT_MMD;
  };
})();
</script>
